<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 200" width="890" height="200">
  <defs>
    <filter id="subtleGlowStats" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .terminal-bg {
      fill: #0D1117;
      stroke: #30363D;
      stroke-width: 1.5;
      rx: 10px;
    }
    .terminal-header {
      fill: #161B22;
      stroke: #30363D;
      stroke-width: 1;
    }
    .dot-red { fill: #FF5F56; }
    .dot-yellow { fill: #FFBD2E; }
    .dot-green { fill: #27C93F; }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Fira Code", monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #8B949E;
    }
    .user-tag {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #8B949E;
    }
    .metric-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      fill: #8B949E;
    }
    .metric-value {
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
      font-size: 24px;
      font-weight: 700;
    }
    .metric-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10.5px;
      font-weight: 500;
      fill: #8B949E;
    }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="888" height="198" class="terminal-bg" filter="url(#subtleGlowStats)" />

  <!-- Terminal Window Bar -->
  <path d="M 1 11 A 10 10 0 0 1 11 1 L 879 1 A 10 10 0 0 1 889 11 L 889 36 L 1 36 Z" class="terminal-header" />

  <!-- Window Controls -->
  <circle cx="20" cy="18" r="5" class="dot-red" />
  <circle cx="36" cy="18" r="5" class="dot-yellow" />
  <circle cx="52" cy="18" r="5" class="dot-green" />

  <!-- Terminal Title & Verified Tag -->
  <text x="80" y="22" class="title-text">arpit@github:~$ github --stats</text>
  <text x="860" y="22" class="user-tag" text-anchor="end">Live GitHub Metrics · 17 Followers</text>

  <!-- Metric Boxes -->
  
    <!-- Metric 1: REPOSITORIES -->
    <g transform="translate(30, 62)">
      <rect x="0" y="0" width="196" height="110" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="16" y="26" class="metric-title">📦  REPOSITORIES</text>
      <text x="16" y="65" class="metric-value" fill="#58A6FF">124</text>
      <text x="16" y="90" class="metric-sub">30 Stars · 3 Forks</text>
    </g>

    <!-- Metric 2: CONTRIBUTIONS -->
    <g transform="translate(240, 62)">
      <rect x="0" y="0" width="196" height="110" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="16" y="26" class="metric-title">⚡  CONTRIBUTIONS</text>
      <text x="16" y="65" class="metric-value" fill="#39D353">1,696</text>
      <text x="16" y="90" class="metric-sub">2,745 Lifetime Total</text>
    </g>

    <!-- Metric 3: BEST STREAK -->
    <g transform="translate(450, 62)">
      <rect x="0" y="0" width="196" height="110" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="16" y="26" class="metric-title">🔥  BEST STREAK</text>
      <text x="16" y="65" class="metric-value" fill="#D29922">29 Days</text>
      <text x="16" y="90" class="metric-sub">4d Active Streak</text>
    </g>

    <!-- Metric 4: TOP LANGUAGE -->
    <g transform="translate(660, 62)">
      <rect x="0" y="0" width="196" height="110" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="16" y="26" class="metric-title">🏆  TOP LANGUAGE</text>
      <text x="16" y="65" class="metric-value" fill="#A371F7">Python</text>
      <text x="16" y="90" class="metric-sub">30.2% Code Weight</text>
    </g>
</svg>
