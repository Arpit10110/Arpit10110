<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" width="440" height="400">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="60%" stop-color="#79C0FF" />
      <stop offset="100%" stop-color="#A371F7" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .terminal-bg {
      fill: #0D1117;
      stroke: #30363D;
      stroke-width: 1.5;
      rx: 10px;
    }
    .terminal-header {
      fill: #161B22;
      stroke: #30363D;
      stroke-width: 1;
    }
    .dot-red { fill: #FF5F56; }
    .dot-yellow { fill: #FFBD2E; }
    .dot-green { fill: #27C93F; }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Fira Code", monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #8B949E;
    }
    .ascii-font {
      font-family: "SF Mono", "Fira Code", Consolas, "Courier New", monospace;
      font-size: 9.5px;
      fill: url(#textGrad);
      letter-spacing: 0.5px;
      white-space: pre;
    }
    .row {
      opacity: 0;
      animation: revealRow 0.4s ease-out forwards;
    }
    @keyframes revealRow {
      0% {
        opacity: 0;
        transform: translateY(3px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="438" height="398" class="terminal-bg" filter="url(#subtleGlow)" />

  <!-- Terminal Window Bar -->
  <path d="M 1 11 A 10 10 0 0 1 11 1 L 429 1 A 10 10 0 0 1 439 11 L 439 36 L 1 36 Z" class="terminal-header" />

  <!-- Window Controls -->
  <circle cx="20" cy="18" r="5" class="dot-red" />
  <circle cx="36" cy="18" r="5" class="dot-yellow" />
  <circle cx="52" cy="18" r="5" class="dot-green" />

  <!-- Terminal Title -->
  <text x="80" y="22" class="title-text">arpit@github:~$ cat ./portrait.ascii</text>

  <!-- ASCII Content -->
  <text class="ascii-font" xml:space="preserve">
    <tspan x="20" y="56.0" class="row" style="animation-delay: 0.0s;">%%%%%%%%%%%%%%%%%%%%%%%@%%%%%%%%%%%%%%%%%%%%%%%%%%%%</tspan>
        <tspan x="20" y="67.5" class="row" style="animation-delay: 0.05s;">%%%%%%%%%%%%%%%%%%%%@%#####%%%%%%%%%%%%%%%%%%%%%%%%%</tspan>
        <tspan x="20" y="79.0" class="row" style="animation-delay: 0.1s;">%%%%%%%%%%%%%%%%%%%#=....:::-*%%%%%%%%%%%%%%%%%%%%%%</tspan>
        <tspan x="20" y="90.5" class="row" style="animation-delay: 0.15s;">%%%%%%%%%%%%%%%%%%*.   ..:::::*%=::::#%%%%%%%%%%%%%%</tspan>
        <tspan x="20" y="102.0" class="row" style="animation-delay: 0.2s;">%%%%%%%%%%%%%%%%%#.    .-++*++%%--:. #%%%%%%%%%%%%%%</tspan>
        <tspan x="20" y="113.5" class="row" style="animation-delay: 0.25s;">#%%%%%%%%%%%%%%%%%-   .:--:===%@-.-=-#@%%%%%%%%%%%%%</tspan>
        <tspan x="20" y="125.0" class="row" style="animation-delay: 0.3s;">#%%%%%%%%%%%%%%%%%%-...:--=--*=#+=-=##%%%%%%%%%%%%%%</tspan>
        <tspan x="20" y="136.5" class="row" style="animation-delay: 0.35s;">##%%%%%#%%%%%%%%%+.  .  .......=::-+=+#%@%%%%%%%%%%%</tspan>
        <tspan x="20" y="148.0" class="row" style="animation-delay: 0.4s;">##%%%%##%%%%%%%%%:     .       .::---+*#*%@%%%%%%%%%</tspan>
        <tspan x="20" y="159.5" class="row" style="animation-delay: 0.45s;">=#%%%%#%%%%%%%%%%*.          .. :----:==::#%%%%%%%%%</tspan>
        <tspan x="20" y="171.0" class="row" style="animation-delay: 0.5s;">.+#%#%#%%%%%%%#=:..           .=:-:::     .=%%%%%%%%</tspan>
        <tspan x="20" y="182.5" class="row" style="animation-delay: 0.55s;">:=+######%%%%*......        . *%:::..       =%@%%%%%</tspan>
        <tspan x="20" y="194.0" class="row" style="animation-delay: 0.6s;">-==*####%%%%%- ...:=.       .:+...:.        .:*%%%%%</tspan>
        <tspan x="20" y="205.5" class="row" style="animation-delay: 0.65s;">-=+*####%%%##....:+%#..     .. .. .         .. *%%%%</tspan>
        <tspan x="20" y="217.0" class="row" style="animation-delay: 0.7s;">==+*#*##%%##*.... *@@= . .     .             . =@%%%</tspan>
        <tspan x="20" y="228.5" class="row" style="animation-delay: 0.75s;">=++#**##%###+.... -@%%.....   .               .#%%%%</tspan>
        <tspan x="20" y="240.0" class="row" style="animation-delay: 0.8s;">=+*#*#######= .... =@@+      .   .         ..-#%%%%%</tspan>
        <tspan x="20" y="251.5" class="row" style="animation-delay: 0.85s;">++**+#######= ..:::.=%%.          .       :%%%%%%%%%</tspan>
        <tspan x="20" y="263.0" class="row" style="animation-delay: 0.9s;">++#*+#*#*##*+  ..::-:-%-           ....    *%%%%%%%%</tspan>
        <tspan x="20" y="274.5" class="row" style="animation-delay: 0.95s;">+*#*#**#*##++=. ......-.     .       ..... .*%%%%%%%</tspan>
        <tspan x="20" y="286.0" class="row" style="animation-delay: 1.0s;">+*#+=--::::::-:     -**=.     ::::.       ..:#%%%%%%</tspan>
        <tspan x="20" y="297.5" class="row" style="animation-delay: 1.05s;">*#+......:......    :*@@%=     :.....::::--:.+%%%%%%</tspan>
        <tspan x="20" y="309.0" class="row" style="animation-delay: 1.1s;">+-  .......          .%%%%+...  ......     .-%%%%%%%</tspan>
        <tspan x="20" y="320.5" class="row" style="animation-delay: 1.15s;">*:        ..          *###%*.....:.    ..  *%%%%%%%%</tspan>
  </text>
</svg>
