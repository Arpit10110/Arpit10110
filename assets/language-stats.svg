<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 326" width="890" height="326">
  <defs>
    <filter id="subtleGlowLang" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .terminal-bg {
      fill: #0D1117;
      stroke: #30363D;
      stroke-width: 1.5;
      rx: 10px;
    }
    .terminal-header {
      fill: #161B22;
      stroke: #30363D;
      stroke-width: 1;
    }
    .dot-red { fill: #FF5F56; }
    .dot-yellow { fill: #FFBD2E; }
    .dot-green { fill: #27C93F; }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Fira Code", monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #8B949E;
    }
    .meta-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #8B949E;
    }
    .lang-name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      fill: #F0F6FC;
    }
    .pct-text {
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
      font-size: 12.5px;
      font-weight: 700;
      fill: #F0F6FC;
    }
    .bytes-text {
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
      font-size: 11px;
      font-weight: 500;
      fill: #8B949E;
    }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="888" height="324" class="terminal-bg" filter="url(#subtleGlowLang)" />

  <!-- Terminal Window Bar -->
  <path d="M 1 11 A 10 10 0 0 1 11 1 L 879 1 A 10 10 0 0 1 889 11 L 889 36 L 1 36 Z" class="terminal-header" />

  <!-- Window Controls -->
  <circle cx="20" cy="18" r="5" class="dot-red" />
  <circle cx="36" cy="18" r="5" class="dot-yellow" />
  <circle cx="52" cy="18" r="5" class="dot-green" />

  <!-- Terminal Title & Meta Info -->
  <text x="80" y="22" class="title-text">arpit@github:~$ language --stats</text>
  <text x="860" y="22" class="meta-text" text-anchor="end">Analyzed 120 owned repositories · 6.0 MB code bytes</text>

  <!-- Language Progress Rows -->
  
    <!-- Row 0: Python -->
    <g transform="translate(30, 80)">
      <!-- Language Dot & Name -->
      <circle cx="6" cy="12" r="5" fill="#3572A5" />
      <text x="22" y="16" class="lang-name">Python</text>

      <!-- Track Background -->
      <rect x="150" y="5" width="380" height="14" rx="4" fill="#21262D" />

      <!-- Progress Fill with smooth animation -->
      <rect x="150" y="5" width="114" height="14" rx="4" fill="#3572A5" opacity="0.9">
        <animate attributeName="width" from="0" to="114" dur="0.8s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
      </rect>

      <!-- Percentage & Bytes -->
      <text x="555" y="16" class="pct-text">30.2%</text>
      <text x="630" y="16" class="bytes-text">1.8 MB</text>
    </g>

    <!-- Row 1: TypeScript -->
    <g transform="translate(30, 116)">
      <!-- Language Dot & Name -->
      <circle cx="6" cy="12" r="5" fill="#3178C6" />
      <text x="22" y="16" class="lang-name">TypeScript</text>

      <!-- Track Background -->
      <rect x="150" y="5" width="380" height="14" rx="4" fill="#21262D" />

      <!-- Progress Fill with smooth animation -->
      <rect x="150" y="5" width="113" height="14" rx="4" fill="#3178C6" opacity="0.9">
        <animate attributeName="width" from="0" to="113" dur="0.8s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
      </rect>

      <!-- Percentage & Bytes -->
      <text x="555" y="16" class="pct-text">29.9%</text>
      <text x="630" y="16" class="bytes-text">1.8 MB</text>
    </g>

    <!-- Row 2: JavaScript -->
    <g transform="translate(30, 152)">
      <!-- Language Dot & Name -->
      <circle cx="6" cy="12" r="5" fill="#F7DF1E" />
      <text x="22" y="16" class="lang-name">JavaScript</text>

      <!-- Track Background -->
      <rect x="150" y="5" width="380" height="14" rx="4" fill="#21262D" />

      <!-- Progress Fill with smooth animation -->
      <rect x="150" y="5" width="111" height="14" rx="4" fill="#F7DF1E" opacity="0.9">
        <animate attributeName="width" from="0" to="111" dur="0.8s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
      </rect>

      <!-- Percentage & Bytes -->
      <text x="555" y="16" class="pct-text">29.4%</text>
      <text x="630" y="16" class="bytes-text">1.8 MB</text>
    </g>

    <!-- Row 3: CSS -->
    <g transform="translate(30, 188)">
      <!-- Language Dot & Name -->
      <circle cx="6" cy="12" r="5" fill="#563D7C" />
      <text x="22" y="16" class="lang-name">CSS</text>

      <!-- Track Background -->
      <rect x="150" y="5" width="380" height="14" rx="4" fill="#21262D" />

      <!-- Progress Fill with smooth animation -->
      <rect x="150" y="5" width="31" height="14" rx="4" fill="#563D7C" opacity="0.9">
        <animate attributeName="width" from="0" to="31" dur="0.8s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
      </rect>

      <!-- Percentage & Bytes -->
      <text x="555" y="16" class="pct-text">8.2%</text>
      <text x="630" y="16" class="bytes-text">508.2 KB</text>
    </g>

    <!-- Row 4: HTML -->
    <g transform="translate(30, 224)">
      <!-- Language Dot & Name -->
      <circle cx="6" cy="12" r="5" fill="#E34C26" />
      <text x="22" y="16" class="lang-name">HTML</text>

      <!-- Track Background -->
      <rect x="150" y="5" width="380" height="14" rx="4" fill="#21262D" />

      <!-- Progress Fill with smooth animation -->
      <rect x="150" y="5" width="7" height="14" rx="4" fill="#E34C26" opacity="0.9">
        <animate attributeName="width" from="0" to="7" dur="0.8s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
      </rect>

      <!-- Percentage & Bytes -->
      <text x="555" y="16" class="pct-text">2.1%</text>
      <text x="630" y="16" class="bytes-text">126.8 KB</text>
    </g>

    <!-- Row 5: C++ -->
    <g transform="translate(30, 260)">
      <!-- Language Dot & Name -->
      <circle cx="6" cy="12" r="5" fill="#F34B7D" />
      <text x="22" y="16" class="lang-name">C++</text>

      <!-- Track Background -->
      <rect x="150" y="5" width="380" height="14" rx="4" fill="#21262D" />

      <!-- Progress Fill with smooth animation -->
      <rect x="150" y="5" width="6" height="14" rx="4" fill="#F34B7D" opacity="0.9">
        <animate attributeName="width" from="0" to="6" dur="0.8s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
      </rect>

      <!-- Percentage & Bytes -->
      <text x="555" y="16" class="pct-text">0.2%</text>
      <text x="630" y="16" class="bytes-text">11.8 KB</text>
    </g>
</svg>
